<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgentLens — Trace Diagnosis</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e2e2e6;
    --text: #1a1a1e;
    --text-dim: #6b6b73;
    --ok: #3a7d44;
    --ok-bg: #eaf5ec;
    --tainted: #9a6b00;
    --tainted-bg: #fbf1dd;
    --critical: #b3261e;
    --critical-bg: #fbe9e7;
    --accent: #4956e3;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c;
      --panel: #202127;
      --border: #33343b;
      --text: #e8e8ea;
      --text-dim: #97979f;
      --ok: #6fcf7c;
      --ok-bg: #1c2d1f;
      --tainted: #e0b03a;
      --tainted-bg: #33290f;
      --critical: #ff6b60;
      --critical-bg: #3a1c1a;
      --accent: #8891f2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c;
    --panel: #202127;
    --border: #33343b;
    --text: #e8e8ea;
    --text-dim: #97979f;
    --ok: #6fcf7c;
    --ok-bg: #1c2d1f;
    --tainted: #e0b03a;
    --tainted-bg: #33290f;
    --critical: #ff6b60;
    --critical-bg: #3a1c1a;
    --accent: #8891f2;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2rem 1.25rem 4rem;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header h1 { font-size: 1.3rem; margin: 0 0 0.15rem; }
  header h1 .navlink { font-size: 0.8rem; font-weight: 500; color: var(--accent); text-decoration: none; margin-left: 0.6rem; }
  header h1 .navlink:hover { text-decoration: underline; }
  header .task { color: var(--text-dim); font-size: 0.92rem; margin: 0 0 1.5rem; }

  .summary-card {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    margin-bottom: 1.75rem;
  }
  .summary-card.no-failure { border-color: var(--ok); }
  .summary-card.has-failure { border-color: var(--critical); }
  .summary-card .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 0.35rem;
  }
  .summary-card .headline { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
  .summary-card .meta { font-size: 0.85rem; color: var(--text-dim); }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
    margin-right: 0.4rem;
  }
  .badge.high { background: var(--critical-bg); color: var(--critical); }
  .badge.medium { background: var(--tainted-bg); color: var(--tainted); }
  .badge.low { background: var(--border); color: var(--text-dim); }
  .badge.rule { background: var(--border); color: var(--text); }
  .badge.judge { background: rgba(73,86,227,0.14); color: var(--accent); }

  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 0.6rem;
    top: 0.4rem;
    bottom: 0.4rem;
    width: 2px;
    background: var(--border);
  }

  .step {
    position: relative;
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.55rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  .step::before {
    content: "";
    position: absolute;
    left: -1.65rem;
    top: 1rem;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--bg);
  }
  .step.ok::before { background: var(--ok); }
  .step.tainted { background: var(--tainted-bg); border-color: var(--tainted); }
  .step.tainted::before { background: var(--tainted); }
  .step.critical {
    background: var(--critical-bg);
    border-color: var(--critical);
    box-shadow: 0 0 0 1px var(--critical);
  }
  .step.critical::before { background: var(--critical); width: 14px; height: 14px; left: -1.75rem; top: 0.85rem; }

  .step .step-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }
  .step .step-idx { font-family: var(--mono); font-size: 0.78rem; color: var(--text-dim); }
  .step .step-type {
    font-family: var(--mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
  }
  .step .step-text {
    font-family: var(--mono);
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.4;
  }
  /* Real traces carry ~10,000-character prose blocks -- an analyst's draft
     report, a critic's review. Rendered in full they bury the timeline, and
     the whole point of this page is seeing where a long trajectory broke at
     a glance. Long steps are clamped and opened on demand; the critical step
     opens itself, since that is the one you came to read. */
  .step-text.clamped {
    max-height: 15em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
  }
  .expand {
    font: inherit;
    font-size: 0.76rem;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0.3rem 0 0;
    cursor: pointer;
    text-decoration: underline;
  }

  /* The judge's PASS 1 extraction, shown under the step each claim came
     from. This is the audit trail for the verdict: a long trace with a
     near-empty claims list means extraction was skipped and the answer
     came from one read, which is exactly the failure the structural fix
     was built to make visible. */
  .evidence-bar {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin: -1.1rem 0 1.5rem;
  }
  .evidence-bar .count { font-weight: 600; color: var(--accent); }
  .evidence-bar button {
    font: inherit;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .claims { margin-top: 0.5rem; border-top: 1px dashed var(--border); padding-top: 0.45rem; }
  .claims.hidden { display: none; }
  .claims .claims-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
  }
  .claim {
    position: relative;
    font-size: 0.8rem;
    line-height: 1.45;
    color: var(--text-dim);
    padding-left: 0.85rem;
    margin-bottom: 0.2rem;
  }
  .claim::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.52em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .step.critical .claim, .step.tainted .claim { color: var(--text); }
  .orphan-claims { margin-top: 1rem; }

  .break-marker {
    position: relative;
    margin: -0.15rem 0 0.7rem;
    padding-left: 0.1rem;
    font-size: 0.78rem;
    color: var(--critical);
    font-weight: 600;
  }
  .break-marker::before {
    content: "";
    position: absolute;
    left: -1.65rem;
    top: 50%;
    width: 12px;
    border-top: 2px dashed var(--critical);
  }

  .findings-panel {
    margin-top: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 1.25rem;
  }
  .findings-panel h2 { font-size: 0.95rem; margin: 0 0 0.75rem; }
  .finding-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
    margin-bottom: 0.5rem;
    background: var(--panel);
    font-size: 0.86rem;
  }
  .finding-row .frow-head { margin-bottom: 0.25rem; }
  .finding-row .frow-summary { color: var(--text); }
  .finding-row .frow-detail { color: var(--text-dim); font-family: var(--mono); font-size: 0.78rem; margin-top: 0.3rem; }

  .empty-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
  }
  code.inline { font-family: var(--mono); background: var(--border); padding: 0.05rem 0.35rem; border-radius: 4px; }

  /* ?embed=1 -- inside index.html, which already has the nav. */
  body.embedded .navlink { display: none; }
</style>
</head>
<body>
<script>
  if (new URLSearchParams(location.search).get("embed") === "1")
    document.currentScript.parentElement.classList.add("embedded");
</script>
<div class="wrap">
  <header>
    <h1>AgentLens <a class="navlink" href="benchmark.html">Benchmark →</a></h1>
    <p class="task" id="task-line">Loading trace diagnosis…</p>
  </header>

  <div id="summary"></div>
  <div id="evidence" class="evidence-bar" style="display:none;"></div>
  <div id="timeline" class="timeline"></div>
  <div id="findings" class="findings-panel" style="display:none;">
    <h2>All findings</h2>
    <div id="findings-list"></div>
  </div>
</div>

<script>
  // Which diagnosis to show, relative to this file. analyze.py writes files
  // in exactly this shape. ?file=... overrides the default so you can point
  // the viewer somewhere else without editing this constant.
  const DEFAULT_DATA_URL = "../real_traces/multi_agent_research_live_diagnosis.json";

  function requestedFile() {
    const raw = new URLSearchParams(location.search).get("file");
    if (!raw) return DEFAULT_DATA_URL;
    // Same-origin only: an absolute URL or a protocol-relative one would let
    // a crafted link render someone else's JSON inside this page.
    if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) {
      console.warn("ignoring non-relative ?file= value");
      return DEFAULT_DATA_URL;
    }
    return raw;
  }

  const DATA_URL = requestedFile();

  function badge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function render(diag) {
    document.getElementById("task-line").textContent = diag.task;

    const summary = document.getElementById("summary");
    const cf = diag.critical_finding;
    const card = document.createElement("div");
    card.className = "summary-card " + (cf ? "has-failure" : "no-failure");

    if (cf) {
      card.innerHTML = `
        <div class="label">Critical step</div>
        <div class="headline">Step ${cf.step_index} — ${cf.category.replace(/_/g, " ")}</div>
        <div class="meta">${cf.summary}</div>
      `;
      const badges = document.createElement("div");
      badges.style.marginTop = "0.5rem";
      badges.appendChild(badge(cf.confidence + " confidence", cf.confidence));
      badges.appendChild(badge(cf.source, cf.source));
      card.appendChild(badges);
    } else if (diag.judge && diag.judge.status && diag.judge.status !== "ran") {
      // Rules alone can't call a trace clean: they never look at meaning.
      // Older diagnosis files have no judge field and keep the old wording.
      const why = { off: "run with --no-judge", not_configured: "no API key was set" }[diag.judge.status]
        || "the judge call failed: " + (diag.judge.error || "unknown error");
      card.className = "summary-card";
      card.innerHTML = `
        <div class="label">Result</div>
        <div class="headline">No rule findings — judge did not run</div>
        <div class="meta"></div>
      `;
      card.querySelector(".meta").textContent =
        `${diag.trace_length} steps checked by rules only (${why}). Semantic failures such as contradictions were not checked.`;
    } else {
      card.innerHTML = `
        <div class="label">Result</div>
        <div class="headline">No failure found</div>
        <div class="meta">${diag.trace_length} steps, no rule or judge findings.</div>
      `;
    }
    summary.appendChild(card);

    // Group the judge's extracted claims by the step each came from, so a
    // verdict can be read against its evidence instead of taken on trust.
    const claims = diag.claims || [];
    const claimsByStep = new Map();
    claims.forEach((c) => {
      if (!claimsByStep.has(c.step)) claimsByStep.set(c.step, []);
      claimsByStep.get(c.step).push(c.claim);
    });

    if (claims.length) {
      const bar = document.getElementById("evidence");
      bar.style.display = "flex";
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = claims.length + (claims.length === 1 ? " claim" : " claims");
      const label = document.createElement("span");
      label.textContent = `extracted from ${claimsByStep.size} of ${diag.steps.length} steps before the verdict`;
      const toggle = document.createElement("button");
      toggle.textContent = "hide";
      toggle.addEventListener("click", () => {
        const blocks = document.querySelectorAll(".claims");
        const hiding = toggle.textContent === "hide";
        blocks.forEach((b) => b.classList.toggle("hidden", hiding));
        toggle.textContent = hiding ? "show" : "hide";
      });
      bar.append(count, label, toggle);
    }

    // Must run after the element is in the document, since it measures.
    function clampIfLong(textEl, stepEl) {
      // scrollHeight is unavailable outside a real layout engine; skip
      // rather than throw, so the page still renders everything.
      if (typeof textEl.scrollHeight !== "number") return;
      textEl.classList.add("clamped");
      if (textEl.scrollHeight <= textEl.clientHeight + 4) {
        textEl.classList.remove("clamped");
        return;
      }
      const button = document.createElement("button");
      button.className = "expand";
      const chars = (textEl.textContent || "").length;
      button.textContent = `show all (${chars.toLocaleString()} characters)`;
      button.addEventListener("click", () => {
        const clamped = textEl.classList.toggle("clamped");
        button.textContent = clamped ? `show all (${chars.toLocaleString()} characters)` : "show less";
      });
      stepEl.insertBefore(button, textEl.nextSibling);
    }

    function claimsBlock(list) {
      const box = document.createElement("div");
      box.className = "claims";
      const label = document.createElement("div");
      label.className = "claims-label";
      label.textContent = list.length === 1 ? "1 claim extracted" : `${list.length} claims extracted`;
      box.appendChild(label);
      list.forEach((text) => {
        const row = document.createElement("div");
        row.className = "claim";
        row.textContent = text;
        box.appendChild(row);
      });
      return box;
    }

    const timeline = document.getElementById("timeline");
    const criticalIdx = cf ? cf.step_index : null;

    diag.steps.forEach((step) => {
      if (criticalIdx !== null && step.index === criticalIdx) {
        const marker = document.createElement("div");
        marker.className = "break-marker";
        marker.textContent = "trajectory breaks here";
        timeline.appendChild(marker);
      }

      const el = document.createElement("div");
      let stateClass = "";
      if (criticalIdx !== null) {
        if (step.index === criticalIdx) stateClass = "critical";
        else if (step.index > criticalIdx) stateClass = "tainted";
        else stateClass = "ok";
      }
      el.className = "step " + stateClass;
      el.innerHTML = `
        <div class="step-head">
          <span class="step-idx">#${step.index}</span>
          <span class="step-type">${step.type.replace(/_/g, " ")}</span>
        </div>
        <div class="step-text"></div>
      `;
      const textEl = el.querySelector(".step-text");
      textEl.textContent = step.text;
      if (claimsByStep.has(step.index)) el.appendChild(claimsBlock(claimsByStep.get(step.index)));
      timeline.appendChild(el);
      if (step.index !== criticalIdx) clampIfLong(textEl, el);
    });

    // A claim tagged with a step that isn't in the trace still has to be
    // shown: silently dropping it would hide the judge citing something
    // that doesn't exist, which is a signal worth seeing, not a glitch.
    const stepIndices = new Set(diag.steps.map((s) => s.index));
    const orphans = claims.filter((c) => !stepIndices.has(c.step));
    if (orphans.length) {
      const box = claimsBlock(orphans.map((c) => `(step ${c.step}, not in trace) ${c.claim}`));
      box.classList.add("orphan-claims");
      timeline.appendChild(box);
    }

    if (diag.findings && diag.findings.length) {
      document.getElementById("findings").style.display = "block";
      const list = document.getElementById("findings-list");
      diag.findings.forEach((f) => {
        const row = document.createElement("div");
        row.className = "finding-row";
        row.innerHTML = `
          <div class="frow-head"></div>
          <div class="frow-summary">Step ${f.step_index} — ${f.summary}</div>
          ${f.detail ? `<div class="frow-detail"></div>` : ""}
        `;
        const head = row.querySelector(".frow-head");
        head.appendChild(badge(f.category.replace(/_/g, " "), f.confidence));
        head.appendChild(badge(f.confidence, f.confidence));
        head.appendChild(badge(f.source, f.source));
        if (f.detail) row.querySelector(".frow-detail").textContent = f.detail;
        list.appendChild(row);
      });
    }
  }

  fetch(DATA_URL)
    .then((r) => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch((err) => {
      document.getElementById("task-line").textContent = "";
      document.getElementById("summary").innerHTML = `
        <div class="empty-state">
          Couldn't load <code class="inline">${DATA_URL}</code> (${err.message}).<br><br>
          Browsers block <code class="inline">fetch()</code> against local files opened directly.
          Serve this folder instead, e.g. from the project root:<br><br>
          <code class="inline">python3 -m http.server</code><br><br>
          then open <code class="inline">http://localhost:8000/output/viewer.html</code>.
        </div>`;
    });
</script>
</body>
</html>
